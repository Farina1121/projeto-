<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGEA - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="auth-layout">
        <div class="auth-card">
            <div class="text-center mb-xl">
                <h1 style="color: var(--color-primary); margin-bottom: var(--space-sm);">SIGEA</h1>
                <p style="color: var(--color-gray-600);">Sistema de Gestão de Aulas</p>
            </div>
            
            <form id="loginForm" class="mb-lg">
                <div class="form-group">
                    <label for="username" class="form-label">Usuário</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-input" 
                        placeholder="Digite seu usuário"
                        required
                        autocomplete="username"
                    >
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Senha</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="Digite sua senha"
                        required
                        autocomplete="current-password"
                    >
                </div>
                
                <div id="loginError" class="alert alert-error hidden" role="alert">
                    <!-- Error message will be inserted here -->
                </div>
                
                <button type="submit" id="submitBtn" class="btn btn-primary w-100">
                    Entrar
                </button>
            </form>
            
            <div class="text-center">
                <div style="background: var(--color-gray-100); padding: var(--space-lg); border-radius: var(--radius-md);">
                    <h4 style="margin-bottom: var(--space-md); color: var(--color-gray-900);">Credenciais de Teste</h4>
                    <div style="display: grid; gap: var(--space-sm); font-size: var(--font-size-sm);">
                        <div><strong>Admin:</strong> claudia / admin123</div>
                        <div><strong>Professor:</strong> marcos / prof123</div>
                        <div><strong>Aluna Dedicada:</strong> ana / aluna123</div>
                        <div><strong>Aluno Acompanhamento:</strong> lucas / aluno123</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/components.js"></script>
</body>
</html>
