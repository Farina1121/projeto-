<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGEA - Sistema de Gestão de Aulas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="auth-layout">
        <div class="auth-card text-center">
            <h1 style="color: var(--color-primary); margin-bottom: var(--space-md);">SIGEA</h1>
            <h2 style="color: var(--color-gray-900); margin-bottom: var(--space-lg);">Sistema de Gestão de Aulas</h2>
            <p style="color: var(--color-gray-600); margin-bottom: var(--space-xl);">
                Bem-vindo ao sistema que revoluciona a gestão educacional com interfaces personalizadas para cada usuário.
            </p>
            
            <div class="loading mb-lg">
                <div class="spinner"></div>
                <span>Redirecionando para o login...</span>
            </div>
            
            <div style="background: var(--color-gray-100); padding: var(--space-md); border-radius: var(--radius-md); font-size: var(--font-size-sm);">
                <p><strong>Desenvolvido com:</strong></p>
                <p>HTML5 • CSS3 • JavaScript • Design System Completo</p>
            </div>
        </div>
    </div>

    <script>
        // Auto redirect to login after 2 seconds
        setTimeout(() => {
            window.location.href = 'pages/login.html';
        }, 2000);
    </script>
</body>
</html>
